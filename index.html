];

const INCIDENT_TYPES = [
  "Emergency Medical","Fire Response","Active Threat",
  "Infrastructure Monitoring","Traffic Incident","UAS Incursion","Other",
];

function PlannerTab() {
  const [initiatives, setInitiatives] = useState(TEMPLATE_ROWS.map(r => ({ ...r })));
  const [form, setForm] = useState({
    initiative_name: "",
    incident_type: "Emergency Medical",
    current_avg_response_minutes: "",
    geography: "",
    peak_incidents_per_day: "",
    notes: "",
  });
  const [reportOpen, setReportOpen] = useState(true);
  const [copied, setCopied] = useState(false);

  /* CSV template download */
  const downloadTemplate = () => {
    const cols = ["initiative_name","incident_type","current_avg_response_minutes","geography","peak_incidents_per_day","notes"];
    const csv = [
      cols.join(","),
      ...TEMPLATE_ROWS.map(r => cols.map(c => {
        const s = String(r[c]).replace(/"/g, '""');
        return /[",\n]/.test(s) ? `"${s}"` : s;
      }).join(","))
    ].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "planner_template.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  /* CSV upload */
  const onUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (res) => {
        const rows = (res.data || []).map(r => ({
          initiative_name: safe(r.initiative_name),
          incident_type: safe(r.incident_type, "Other"),
          current_avg_response_minutes: Number(r.current_avg_response_minutes) || 0,
          geography: safe(r.geography),
          peak_incidents_per_day: Number(r.peak_incidents_per_day) || 0,
          notes: safe(r.notes, "Not reported"),
        })).filter(r => r.initiative_name !== "Unknown");
        if (rows.length) setInitiatives(rows);
      },
    });
    e.target.value = "";
  };

  const addInitiative = () => {
    if (!form.initiative_name.trim()) return;
    const cur = Number(form.current_avg_response_minutes);
    const peak = Number(form.peak_incidents_per_day);
    setInitiatives(prev => [...prev, {
      initiative_name: form.initiative_name.trim(),
      incident_type: form.incident_type,
      current_avg_response_minutes: Number.isFinite(cur) ? cur : 0,
      geography: form.geography.trim() || "Unknown",
      peak_incidents_per_day: Number.isFinite(peak) ? peak : 0,
      notes: form.notes.trim() || "Not reported",
    }]);
    setForm({ initiative_name: "", incident_type: "Emergency Medical", current_avg_response_minutes: "", geography: "", peak_incidents_per_day: "", notes: "" });
  };

  /* Predictions */
  const predictions = useMemo(() => initiatives.map(it => {
    const cur = Number(it.current_avg_response_minutes) || 0;
    const dfr = cur * 0.13;
    const v1 = cur * 0.118;
    const v2 = cur * 0.085;
    const v3 = cur * 0.057;
    const v4 = cur * 0.048;
    const saved = cur - v4;
    const pctImp = cur ? (saved / cur) * 100 : 0;
    const annual = saved * (Number(it.peak_incidents_per_day) || 0) * 365;
    return { ...it, dfr, v1, v2, v3, v4, saved, pctImp, annual };
  }), [initiatives]);

  const avgImprovement = predictions.length
    ? predictions.reduce((a, b) => a + b.pctImp, 0) / predictions.length
    : 0;
  const highestImpact = predictions.length
    ? predictions.reduce((a, b) => (b.annual > a.annual ? b : a), predictions[0])
    : null;
  const inWindowAfter = predictions.filter(p => p.v4 <= 0.25).length; // 15 seconds = 0.25 min

  /* Chart data */
  const chartData = predictions.map(p => ({
    name: p.initiative_name,
    Current: Number(p.current_avg_response_minutes) || 0,
    DFR: Number(p.dfr.toFixed(2)),
    "Agentic v4": Number(p.v4.toFixed(2)),
  }));

  /* Memo text */
  const memoText = useMemo(() => {
    if (!predictions.length) return "No initiatives loaded.";
    const lines = [];
    lines.push("AGENT RECOMMENDATION REPORT");
    lines.push("");
    lines.push(`Summary: ${predictions.length} initiative${predictions.length === 1 ? "" : "s"} were modeled against the UAS Response Latency benchmark stack. Average modeled improvement at the v4 (full agentic) tier is ${avgImprovement.toFixed(1)}%, equivalent to compressing decision, deployment, and travel latency in parallel.`);
    lines.push("");
    if (highestImpact) {
      lines.push(`Highest Impact: ${highestImpact.initiative_name} (${highestImpact.geography}) shows the largest absolute time saved per year, at approximately ${highestImpact.annual.toFixed(2)} minutes annually based on a current response of ${Number(highestImpact.current_avg_response_minutes).toFixed(2)} minutes and ${highestImpact.peak_incidents_per_day} peak incidents per day.`);
      lines.push("");
    }
    lines.push(`Engagement Window: At the v4 tier, ${inWindowAfter} of ${predictions.length} initiative${predictions.length === 1 ? "" : "s"} fall within the 15-second engagement window benchmark drawn from the UAS Latency Index. The remainder benefit from large percentage reductions but remain bounded by physical travel time.`);
    lines.push("");
    lines.push("Architecture: Recommend an agentic coordination layer that (a) compresses decision latency from ~20s to ~5s through pre-authorized response policies, (b) compresses deployment latency from ~20s to ~10s through automated dispatch, and (c) reduces travel distance 30%–60% through dynamic pre-positioning informed by historical demand surfaces.");
    lines.push("");
    lines.push("Governance: Any deployment should preserve human-on-the-loop authority for kinetic or irreversible actions, log all agent decisions for after-action review, and surface uncertainty estimates to dispatchers in real time.");
    return lines.join("\n");
  }, [predictions, avgImprovement, highestImpact, inWindowAfter]);

  const copyReport = async () => {
    try {
      await navigator.clipboard.writeText(memoText);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = memoText; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {}
      document.body.removeChild(ta);
    }
  };

  return (
    <div className="space-y-8">
      <header>
        <h1 className="text-2xl font-bold text-white">Agentic Crisis Response Planner</h1>
        <p className="font-bold text-gray-200 mt-1">
          Upload your existing 911 or EMS response data. The agent applies latency reduction benchmarks from the UAS Response Latency Index to predict how an agentic coordination layer would improve your operations.
        </p>
      </header>

      <InfoBox tone="blue">
        Reduction factors are derived from the UAS Response Latency research model. The agentic layer reduces response time by compressing three bottlenecks: decision latency (from 20s to 5s), deployment latency (from 20s to 10s), and travel latency via dynamic pre-positioning reducing distance by 30% to 60%. Combined this produces an estimated 63% reduction in total response time for most incident types.
      </InfoBox>

      <section className="space-y-3">
        <Btn onClick={downloadTemplate} variant="secondary">⬇ Download Sample Template</Btn>
      </section>

      <section>
        <SectionTitle>Upload Your Data</SectionTitle>
        <Card className="p-4">
          <input type="file" accept=".csv,text/csv" onChange={onUpload}
            className="text-sm text-gray-300 file:mr-3 file:rounded file:border-0 file:bg-red-600 file:text-white file:px-3 file:py-2 file:cursor-pointer" />
          <p className="text-xs text-gray-500 mt-2">Expected columns: initiative_name, incident_type, current_avg_response_minutes, geography, peak_incidents_per_day, notes.</p>
        </Card>

        {initiatives.length > 0 ? (
          <div className="mt-4 overflow-x-auto border border-[#333] rounded">
            <table className="w-full text-sm">
              <thead className="bg-[#1a1a1a]">
                <tr>
                  {["Initiative","Type","Current (min)","Geography","Peak/day","Notes"].map(h => (
                    <th key={h} className="text-left px-3 py-2 font-medium text-gray-300 border-b border-[#333]">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {initiatives.map((r, i) => (
                  <tr key={i} className="bg-[#111] border-b border-[#222]">
                    <td className="px-3 py-2 text-white">{safe(r.initiative_name)}</td>
                    <td className="px-3 py-2">{safe(r.incident_type)}</td>
                    <td className="px-3 py-2 mono">{num(r.current_avg_response_minutes)}</td>
                    <td className="px-3 py-2">{safe(r.geography)}</td>
                    <td className="px-3 py-2 mono">{r.peak_incidents_per_day == null ? "Unknown" : r.peak_incidents_per_day}</td>
                    <td className="px-3 py-2">{safe(r.notes, "Not reported")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : null}
      </section>

      <section>
        <SectionTitle>Or Add Initiatives Manually</SectionTitle>
        <Card className="p-4 grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label className="text-xs uppercase text-gray-400">Initiative Name</label>
            <Input value={form.initiative_name} onChange={e => setForm({ ...form, initiative_name: e.target.value })} placeholder="e.g. Cardiac Response Bronx" />
          </div>
          <div>
            <label className="text-xs uppercase text-gray-400">Incident Type</label>
            <Select value={form.incident_type} onChange={e => setForm({ ...form, incident_type: e.target.value })} className="w-full">
              {INCIDENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
            </Select>
          </div>
          <div>
            <label className="text-xs uppercase text-gray-400">Current Avg Response (min)</label>
            <Input type="number" step="0.1" value={form.current_avg_response_minutes} onChange={e => setForm({ ...form, current_avg_response_minutes: e.target.value })} placeholder="e.g. 14.2" />
          </div>
          <div>
            <label className="text-xs uppercase text-gray-400">Geography</label>
            <Input value={form.geography} onChange={e => setForm({ ...form, geography: e.target.value })} placeholder="e.g. Bronx NY" />
          </div>
          <div>
            <label className="text-xs uppercase text-gray-400">Peak Incidents Per Day</label>
            <Input type="number" step="1" value={form.peak_incidents_per_day} onChange={e => setForm({ ...form, peak_incidents_per_day: e.target.value })} placeholder="e.g. 30" />
          </div>
          <div className="md:col-span-2">
            <label className="text-xs uppercase text-gray-400">Notes</label>
            <Textarea rows={2} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} placeholder="Optional context, source, caveats…" />
          </div>
          <div className="md:col-span-2">
            <Btn onClick={addInitiative} variant="primary">+ Add Initiative</Btn>
          </div>
        </Card>
      </section>

      <section>
        <SectionTitle>Agentic Performance Prediction</SectionTitle>
        <div className="overflow-x-auto border border-[#333] rounded">
          <table className="w-full text-sm">
            <thead className="bg-[#1a1a1a]">
              <tr>
                {["Initiative","Current (min)","DFR (min)","Agentic v1 (min)","Agentic v2 (min)","Agentic v3 (min)","Agentic v4 (min)","Minutes Saved","% Improvement","Annual Time Saved (min)"]
                  .map((h, i) => (
                  <th key={h} className={`text-left px-3 py-2 font-medium border-b border-[#333] ${i === 6 ? "text-red-400" : "text-gray-300"}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {predictions.length === 0 ? (
                <tr><td colSpan={10} className="px-3 py-6 text-center text-gray-500">Add or upload at least one initiative.</td></tr>
              ) : predictions.map((p, i) => (
                <tr key={i} className="bg-[#111] border-b border-[#222] hover:bg-[#181818]">
                  <td className="px-3 py-2 text-white">{safe(p.initiative_name)}</td>
                  <td className="px-3 py-2 mono">{num(p.current_avg_response_minutes)}</td>
                  <td className="px-3 py-2 mono">{num(p.dfr)}</td>
                  <td className="px-3 py-2 mono">{num(p.v1)}</td>
                  <td className="px-3 py-2 mono">{num(p.v2)}</td>
                  <td className="px-3 py-2 mono">{num(p.v3)}</td>
                  <td className="px-3 py-2 mono text-red-400 font-bold bg-red-950/30">{num(p.v4)}</td>
                  <td className="px-3 py-2 mono">{num(p.saved)}</td>
                  <td className="px-3 py-2 mono">{num(p.pctImp)}%</td>
                  <td className="px-3 py-2 mono">{num(p.annual)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {predictions.length > 0 ? (
          <Card className="p-4 mt-4">
            <div className="text-sm font-medium text-white mb-2">Current vs DFR vs Agentic v4</div>
            <div style={{ width: "100%", height: 320 }}>
              <ResponsiveContainer>
                <BarChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 30 }}>
                  <CartesianGrid stroke="#222" strokeDasharray="3 3" />
                  <XAxis dataKey="name" stroke="#888" tick={{ fill: "#ccc", fontSize: 11 }} angle={-15} textAnchor="end" height={60} />
                  <YAxis stroke="#888" tick={{ fill: "#ccc", fontSize: 11 }} label={{ value: "minutes", angle: -90, position: "insideLeft", fill: "#888" }} />
                  <Tooltip contentStyle={{ background: "#0a0a0a", border: "1px solid #333", color: "#fff" }} />
                  <Legend wrapperStyle={{ color: "#ccc" }} />
                  <Bar dataKey="Current" fill="#ef4444" />
                  <Bar dataKey="DFR" fill="#3b82f6" />
                  <Bar dataKey="Agentic v4" fill="#22c55e" />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Card>
        ) : null}
      </section>

      <section>
        <SectionTitle>Agent Recommendation Report</SectionTitle>
        <Card>
          <details open={reportOpen} onToggle={(e) => setReportOpen(e.target.open)}>
            <summary className="px-4 py-3 flex items-center justify-between text-white">
              <span className="font-medium">Memo (auto-generated)</span>
              <span className="text-xs text-gray-400">{reportOpen ? "Hide ▼" : "Show ▶"}</span>
            </summary>
            <div className="px-4 pb-4 border-t border-[#222]">
              <div className="flex items-center gap-2 my-3">
                <Btn onClick={copyReport} variant="secondary">📋 Copy Report Text</Btn>
                {copied ? <span className="text-xs text-green-400">Copied!</span> : null}
              </div>
              <pre className="whitespace-pre-wrap text-sm text-gray-200 leading-relaxed" style={{ fontFamily: "'Courier New', Courier, monospace" }}>{memoText}</pre>
            </div>
          </details>
        </Card>
      </section>

      <section>
        <SectionTitle>Methodology Note</SectionTitle>
        <Card className="p-4 text-sm text-gray-300 space-y-2">
          <p>
            The reduction factors used in this planner — DFR at 13% of current response time, and agentic
            tiers v1 through v4 at 11.8%, 8.5%, 5.7%, and 4.8% respectively — are derived from the Omni
            City model and from the UAS Response Latency Index research presented on the prior tab.
          </p>
          <p>
            They reflect the modeled impact of compressing three sequential bottlenecks: decision latency
            (from approximately 20 seconds to 5 seconds), deployment latency (from approximately 20 seconds
            to 10 seconds), and travel latency through dynamic pre-positioning that reduces effective
            distance by 30% to 60%.
          </p>
          <p>
            These figures are illustrative benchmarks for planning conversations, not commitments. Actual
            results depend on jurisdictional policy, fleet composition, and on whether human authority is
            preserved over kinetic or irreversible response actions.
          </p>
        </Card>
      </section>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App shell                                                          */
/* ------------------------------------------------------------------ */
function ApiKeyBar({ apiKey, setApiKey, model, setModel, backendUrl, setBackendUrl }) {
  const [show, setShow] = useState(false);
  const [open, setOpen] = useState(!apiKey && !backendUrl);
  const masked = apiKey ? apiKey.slice(0, 8) + "…" + apiKey.slice(-4) : "";
  const hasBackend = !!backendUrl;
  return (
    <div id="api-key-bar" className="border-b border-[#222] bg-[#0d0d0d] sticky top-0 z-[1000] shadow-lg">
      <div className="px-6 py-2 flex items-center gap-3 text-xs flex-wrap">
        <span className="text-gray-400 uppercase tracking-wider">Mode</span>
        {hasBackend ? (
          <span className="text-green-400">📡 backend · {backendUrl.replace(/^https?:\/\//, "")}</span>
        ) : apiKey ? (
          <span className="text-green-400">🔑 browser-direct · key {masked}</span>
        ) : (
          <span className="text-yellow-400">⚠ no backend, no key — agent disabled (click Configure →)</span>
        )}
        <button onClick={() => setOpen(o => !o)} className={`ml-auto rounded px-2 py-1 border ${(apiKey || hasBackend) ? "text-gray-300 hover:text-white border-[#333]" : "text-yellow-300 border-yellow-700 bg-yellow-950/40 hover:bg-yellow-900/50"}`}>
          {open ? "Hide" : "Configure"}
        </button>
      </div>
      {open ? (
        <div className="px-6 pb-3 space-y-3">
          <div>
            <label className="text-[10px] uppercase tracking-wider text-gray-500">Backend URL (recommended for public hosting — visitors don't need a key)</label>
            <div className="flex gap-2">
              <input type="text" value={backendUrl} onChange={e => setBackendUrl(e.target.value.trim().replace(/\/+$/, ""))}
                placeholder="https://uas-latency-agent.your-subdomain.workers.dev"
                className="flex-1 bg-[#0a0a0a] border border-[#333] rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-green-500" />
              {backendUrl ? (
                <button onClick={() => setBackendUrl("")} className="text-xs text-gray-300 hover:text-red-300 border border-[#333] rounded px-2 py-1 whitespace-nowrap">Clear</button>
              ) : null}
            </div>
            <div className="text-[11px] text-gray-500 mt-1">
              When set, the app reads pre-classified items from your Cloudflare Worker (no API key needed). Leave blank to run live in the browser with your own key.
            </div>
          </div>

          <div className="flex flex-wrap gap-2 items-end">
            <div className="flex-1 min-w-[280px]">
              <label className="text-[10px] uppercase tracking-wider text-gray-500">
                Anthropic API Key (in-memory only — only needed in browser-direct mode)
              </label>
              <div className="flex">
                <input type={show ? "text" : "password"} value={apiKey} onChange={e => setApiKey(e.target.value)}
                  placeholder={hasBackend ? "(not needed when backend is set)" : "sk-ant-…"}
                  disabled={hasBackend}
                  className="flex-1 bg-[#0a0a0a] border border-[#333] rounded-l px-3 py-2 text-white text-sm focus:outline-none focus:border-red-500 disabled:opacity-40" />
                <button onClick={() => setShow(s => !s)} className="border border-l-0 border-[#333] px-3 text-xs text-gray-300 hover:text-white rounded-r">{show ? "hide" : "show"}</button>
              </div>
            </div>
            <div>
              <label className="text-[10px] uppercase tracking-wider text-gray-500">Model (browser mode)</label>
              <select value={model} onChange={e => setModel(e.target.value)} disabled={hasBackend}
                className="bg-[#0a0a0a] border border-[#333] rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-red-500 disabled:opacity-40">
                <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (fast / cheap)</option>
                <option value="claude-sonnet-4-6">claude-sonnet-4-6 (balanced)</option>
                <option value="claude-opus-4-6">claude-opus-4-6 (best quality)</option>
              </select>
            </div>
            <div className="text-[11px] text-gray-500 max-w-[420px]">
              Browser-direct uses <code>anthropic-dangerous-direct-browser-access</code>. Use a personal key; do not share this URL with the key entered.
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("latency");
  const [apiKey, setApiKey] = useState("");
  const [model, setModel] = useState("claude-haiku-4-5-20251001");
  const [backendUrl, setBackendUrl] = useState(readBackendFromUrl());
  return (
    <div className="min-h-screen" style={{ background: "#0a0a0a" }}>
      <div className="border-b border-[#222]">
        <div className="px-6 pt-5 pb-2">
          <div className="text-xs uppercase tracking-widest text-gray-500">Research Preview</div>
          <h1 className="text-3xl font-bold text-white mt-1">UAS Response Latency Index <span className="text-red-500">+</span> Agentic Crisis Planner</h1>
        </div>
        <Tabs value={tab} onChange={setTab} />
      </div>
      <ApiKeyBar apiKey={apiKey} setApiKey={setApiKey} model={model} setModel={setModel} backendUrl={backendUrl} setBackendUrl={setBackendUrl} />
      <main className="px-6 py-6 max-w-[1400px] mx-auto">
        {tab === "latency" ? <UASLatencyTab apiKey={apiKey} setApiKey={setApiKey} model={model} backendUrl={backendUrl} /> : <PlannerTab />}
      </main>
      <footer className="px-6 py-6 text-xs text-gray-500 border-t border-[#222]">
        Illustrative research preview · Courier New · dark mode · all data is local to this page.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

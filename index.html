// so visitors don't need to paste it. Leave "" to require a key from each visitor.
// Example: "https://uas-latency-agent.your-subdomain.workers.dev"
const DEFAULT_BACKEND_URL = "";

// Read ?backend=https://... from the URL on first load. Lets you share a link
// like https://your.site/?backend=https://your-worker.workers.dev
function readBackendFromUrl() {
  try {
    const u = new URL(window.location.href);
    const b = u.searchParams.get("backend");
    if (b && /^https?:\/\//.test(b)) return b.replace(/\/+$/, "");
  } catch {}
  return DEFAULT_BACKEND_URL;
}

const safe = (v, fallback = "Unknown") => {
  if (v === null || v === undefined) return fallback;
  if (typeof v === "number" && Number.isNaN(v)) return fallback;
  const s = String(v).trim().toLowerCase();
  if (s === "" || s === "nan" || s === "null" || s === "undefined" || s === "none") return fallback;
  return v;
};
const num = (v, decimals = 2) => {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return "Unknown";
  return Number(v).toFixed(decimals);
};
const pct = (v) => {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return "Unknown";
  return Number(v).toFixed(1) + "%";
};
const formatTimestamp = (d) => {
  if (!d) return "Unknown";
  const dt = typeof d === "string" ? new Date(d) : d;
  if (Number.isNaN(dt.getTime())) return "Unknown";
  return dt.toISOString().replace("T", " ").slice(0, 19) + "Z";
};

const LeafletMap = ({ id, center, zoom, markers, heatmap, viewMode = "markers", height = 400, legend }) => {
  const ref = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const heatRef = useRef(null);

  useEffect(() => {
    if (!ref.current || mapRef.current) return;
    const map = L.map(ref.current, { zoomControl: true, attributionControl: true })
      .setView(center, zoom);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap, &copy; CARTO',
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
  }, []);

  useEffect(() => {
    if (!mapRef.current || !layerRef.current) return;
    const showMarkers = viewMode === "markers" || viewMode === "both";
    layerRef.current.clearLayers();
    if (showMarkers) {
      (markers || []).forEach(m => {
        const icon = L.divIcon({
          className: "",
          html: `<div style="width:14px;height:14px;border-radius:50%;background:${m.color};border:2px solid #fff;box-shadow:0 0 6px ${m.color};"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
        });
        const marker = L.marker([m.lat, m.lon], { icon }).addTo(layerRef.current);
        if (m.popup) marker.bindPopup(m.popup);
      });
    }
  }, [markers, viewMode]);

  useEffect(() => {
    if (!mapRef.current) return;
    const showHeat = (viewMode === "heatmap" || viewMode === "both") && Array.isArray(heatmap) && heatmap.length > 0;
    if (heatRef.current) {
      mapRef.current.removeLayer(heatRef.current);
      heatRef.current = null;
    }
    if (showHeat && typeof L.heatLayer === "function") {
      heatRef.current = L.heatLayer(heatmap, {
        radius: 28,
        blur: 22,
        maxZoom: 8,
        max: 1.0,
        minOpacity: 0.35,
        gradient: { 0.0: "#1e3a8a", 0.3: "#7e22ce", 0.55: "#ef4444", 0.8: "#f97316", 1.0: "#fde047" },
      }).addTo(mapRef.current);
    }
  }, [heatmap, viewMode]);

  return (
    <div className="relative">
      <div id={id} ref={ref} style={{ height: `${height}px`, width: "100%", borderRadius: 6, border: "1px solid #333" }} />
      {legend ? (
        <div className="absolute bottom-2 right-2 bg-[#0a0a0a]/90 border border-[#333] rounded p-2 text-xs space-y-1 z-[500]">
          {legend.map((l, i) => (
            <div key={i} className="flex items-center gap-2">
              <span style={{ width: 10, height: 10, borderRadius: "50%", background: l.color, display: "inline-block" }} />
              <span>{l.label}</span>
            </div>
          ))}
        </div>
      ) : null}
    </div>
  );
};

const SearchableTable = ({ rows, columns, search, setSearch, placeholder = "Search…", emptyText = "No matching rows." }) => {
  const filtered = useMemo(() => {
    if (!search) return rows;
    const q = search.toLowerCase();
    return rows.filter(r =>
      columns.some(c => String(safe(r[c.key], "")).toLowerCase().includes(q))
    );
  }, [rows, columns, search]);
  return (
    <div className="space-y-2">
      <Input value={search} onChange={e => setSearch(e.target.value)} placeholder={placeholder} />
      <div className="overflow-x-auto border border-[#333] rounded">
        <table className="w-full text-sm">
          <thead className="bg-[#1a1a1a]">
            <tr>
              {columns.map(c => (
                <th key={c.key} className="text-left px-3 py-2 font-medium text-gray-300 border-b border-[#333]">{c.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr><td colSpan={columns.length} className="px-3 py-6 text-center text-gray-500">{emptyText}</td></tr>
            ) : filtered.map((r, i) => (
              <tr key={i} className="bg-[#111] border-b border-[#222] hover:bg-[#181818]">
                {columns.map(c => (
                  <td key={c.key} className="px-3 py-2 text-gray-200 mono">
                    {c.render ? c.render(r) : safe(r[c.key])}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// Wrap fetch with a hard timeout so a slow proxy can't hang the UI forever
async function fetchWithTimeout(url, opts = {}, ms = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(new Error(`timeout after ${ms}ms`)), ms);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function fetchFeedViaRss2Json(feed, count = 6) {
  // Free tier no longer allows count param — fetch full and slice client-side.
  const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
  const res = await fetchWithTimeout(url, {}, 10000);
  if (!res.ok) throw new Error(`rss2json HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== "ok" || !Array.isArray(data.items)) throw new Error(data.message || "rss2json parse failed");
  return data.items.slice(0, count).map(it => ({
    source: feed.name,
    category: feed.category,
    title: (it.title || "").trim(),
    link: it.link || "",
    pubDate: it.pubDate || "",
    description: stripHtml(it.description).slice(0, 500),
  }));
}

// Fallback: allorigins.win returns raw XML, parse with DOMParser
async function fetchFeedViaAllOrigins(feed, count = 6) {
  const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(feed.url)}`;
  const res = await fetchWithTimeout(url, {}, 10000);
  if (!res.ok) throw new Error(`allorigins HTTP ${res.status}`);
  const xml = await res.text();
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const parserError = doc.querySelector("parsererror");
  if (parserError) throw new Error("allorigins XML parse failed");
  // RSS 2.0 uses <item>, Atom uses <entry>
  const nodes = Array.from(doc.querySelectorAll("item, entry")).slice(0, count);
  if (nodes.length === 0) throw new Error("allorigins: no items in feed");
  return nodes.map(n => {
    const get = (sel) => {
      const el = n.querySelector(sel);
      return el ? (el.textContent || "").trim() : "";
    };
    const linkEl = n.querySelector("link");
    const link = linkEl ? (linkEl.textContent.trim() || linkEl.getAttribute("href") || "") : "";
    return {
      source: feed.name,
      category: feed.category,
      title: get("title"),
      link,
      pubDate: get("pubDate") || get("published") || get("updated"),
      description: stripHtml(get("description") || get("summary") || get("content")).slice(0, 500),
    };
  });
}

async function fetchFeed(feed, count = 6) {
  let rssErr = null;
  try {
    const items = await fetchFeedViaRss2Json(feed, count);
    return { items, via: "rss2json" };
  } catch (e) { rssErr = e; }
  try {
    const items = await fetchFeedViaAllOrigins(feed, count);
    return { items, via: "allorigins", rss2jsonError: rssErr?.message };
  } catch (e2) {
    throw new Error(`rss2json: ${rssErr?.message || "fail"} · allorigins: ${e2.message || "fail"}`);
  }
}

async function classifyWithClaude(apiKey, model, items, transcriptSink) {
  const list = items.map((it, i) => `[${i}] SOURCE: ${it.source} | TITLE: ${it.title} | DESC: ${it.description}`).join("\n");
  const sys = "You are a defense OSINT analyst classifying news items. Return only a JSON array, no prose, no markdown fences. Make confident geographic inferences from context — do not return null for conflict_zone, country, lat, or lon unless the item provides truly zero geographic signal.";
  const user = `Below are RSS items. For each, return one JSON object with these fields:

- index (integer matching the input index)
- is_drone_related (boolean: true only if the item is substantively about uncrewed aerial systems / drones / UAS / UAV / loitering munitions / counter-drone)
- conflict_zone (string — be specific, e.g. "Eastern Ukraine", "Red Sea Shipping Lane", "Israeli Northern Border", "Sudan Civil War", "Persian Gulf", "Taiwan Strait")
- country (full country name)
- lat (number — best-guess centroid for the conflict_zone)
- lon (number — best-guess centroid for the conflict_zone)
- drone_class (one of "one-way attack", "ISR", "loitering munition", "quadcopter", "fixed-wing", "swarm", "unknown")
- response_type (one of "kinetic", "EW/jamming", "passive", "none", "unknown")
- reported_latency_seconds (number or null — only if the item explicitly states a response time)
- triad_lens (one of "accelerationist", "safetyist", "skeptic" — your best read of the framing)
- summary (one sentence, <=200 chars)

INFERENCE RULES — apply these aggressively:
- "Ukraine" / "Kyiv" / "Donetsk" / "Kharkiv" / "Zaporizhzhia" → Eastern Ukraine, Ukraine, ~48.5, 37.8
- "Red Sea" / "Houthi" / "Bab-el-Mandeb" / "USS …" attacked by drones → Red Sea Shipping Lane, Yemen, 13.5, 43.0
- "Israel" / "IDF" / "Gaza" / "Lebanon border" / "Hezbollah" → Israeli Northern Border or Gaza, Israel, 33.1, 35.6
- "Russia" attacking infrastructure → Eastern Ukraine if Ukrainian targets, else Russia
- "Pentagon" / "DoD" without a theater → United States, 38.9, -77.0 (treat as policy item; conflict_zone = "Pentagon Policy")
- "Iran" / "IRGC" → Persian Gulf, Iran, 26.5, 51.5
- Source = "USNI News" with no other signal → likely maritime; if unclear, "Indo-Pacific Maritime", 15, 130
- Source = "ISW" with no other signal → likely Russia/Ukraine; default to Eastern Ukraine
- Source = "Bellingcat" → use whatever country signal is in headline
- Only return null for conflict_zone/lat/lon if the headline is truly geographically silent (e.g. "How to think about loitering munitions").

Return ONLY a JSON array of objects. No prose. No code fences.

Items:
${list}`;

  const res = await fetchWithTimeout("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({
      model,
      max_tokens: 4096,
      system: sys,
      messages: [{ role: "user", content: user }],
    }),
  }, 60000);
  const rawBody = await res.text();
  if (transcriptSink) {
    transcriptSink({
      timestamp: new Date().toISOString(),
      model,
      http_status: res.status,
      request: { system: sys, user, item_count: items.length },
      response_raw: rawBody.slice(0, 20000),
    });
  }
  if (!res.ok) {
    throw new Error(`Claude API ${res.status}: ${rawBody.slice(0, 300)}`);
  }
  let data;
  try { data = JSON.parse(rawBody); } catch { throw new Error("Claude returned non-JSON body"); }
  let text = (data.content && data.content[0] && data.content[0].text) || "[]";
  text = text.trim().replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
  // tolerate any leading prose by grabbing first [ ... ] block
  const start = text.indexOf("[");
  const end = text.lastIndexOf("]");
  if (start !== -1 && end !== -1) text = text.slice(start, end + 1);
  return JSON.parse(text);
}

function DefenseFeedScanner({ apiKey, setApiKey, model, backendUrl, appendIncidents }) {
  const [items, setItems] = useState([]);
  const [status, setStatus] = useState("idle"); // idle | fetching | classifying | ready | error
  const [error, setError] = useState(null);
  const [lastSweep, setLastSweep] = useState(null);
  const [search, setSearch] = useState("");
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [feedErrors, setFeedErrors] = useState([]);
  const [draftKey, setDraftKey] = useState("");
  const [keyJustSaved, setKeyJustSaved] = useState(false);
  const [diag, setDiag] = useState(null); // { rss: {...}, claude: {...} }
  const [diagRunning, setDiagRunning] = useState(false);
  const [transcript, setTranscript] = useState([]); // { timestamp, model, http_status, request, response_raw }
  const [sources, setSources] = useState(null); // { rss: N, acled: N, gdelt: N }
  const [mapView, setMapView] = useState("markers"); // "markers" | "heatmap" | "both"

  const runDiagnostics = async () => {
    setDiagRunning(true);

    // === Backend mode: just test the backend ===
    if (backendUrl) {
      setDiag({ rss: { status: "running" }, claude: { status: "running" } });
      const result = { rss: null, claude: null };
      try {
        const res = await fetchWithTimeout(`${backendUrl}/api/items`, {}, 15000);
        const text = await res.text();
        let parsed = null;
        try { parsed = JSON.parse(text); } catch {}
        if (res.ok && parsed && Array.isArray(parsed.classified)) {
          result.rss = {
            status: "ok",
            httpStatus: res.status,
            message: `Backend returned ${parsed.classified.length} classified items, generated_at ${parsed.generated_at || "unknown"}`,
            sample: parsed.classified[0]?.title || null,
          };
          result.claude = {
            status: "ok",
            httpStatus: res.status,
            model: parsed.classified[0] ? "(backend used its own model)" : model,
            message: `Backend mode active — Claude calls happen server-side on a cron schedule, not from this browser.`,
          };
        } else {
          result.rss = {
            status: "fail",
            httpStatus: res.status,
            message: parsed?.error || text.slice(0, 300) || "no body",
          };
          result.claude = { status: "skipped", message: "Backend test failed — see RSS box for the response." };
        }
      } catch (e) {
        result.rss = { status: "fail", message: `Backend unreachable: ${e.message || e}` };
        result.claude = { status: "skipped", message: "Backend test failed — Claude not tested." };
      }
      setDiag(result);
      setDiagRunning(false);
      return;
    }

    setDiag({ rss: { status: "running" }, claude: { status: "running" } });
    const out = { rss: null, claude: null };

    // 1) RSS test — use the same fetcher pipeline the agent uses (rss2json → allorigins fallback)
    try {
      const testFeed = DEFENSE_FEEDS[0];
      const { items, via } = await fetchFeed(testFeed, 1);
      out.rss = {
        status: items.length > 0 ? "ok" : "fail",
        message: items.length > 0 ? `Got ${items.length} item(s) from ${testFeed.name} via ${via}` : "no items",
        sample: items[0]?.title || null,
      };
    } catch (e) {
      out.rss = { status: "fail", message: "All RSS proxies failed: " + (e.message || String(e)) };
    }
    // Push partial result so the user sees RSS finish before Claude
    setDiag({ ...out, claude: { status: "running" } });

    // 2) Claude API test (minimal: ask for a single word)
    const key = apiKey || draftKey.trim();
    if (key && key !== apiKey) {
      // Commit the draft so the rest of the UI catches up
      setApiKey(key);
      setKeyJustSaved(true);
      setTimeout(() => setKeyJustSaved(false), 2500);
    }
    if (!key) {
      out.claude = { status: "skipped", message: "No API key set." };
    } else {
      try {
        const res = await fetchWithTimeout("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
            "content-type": "application/json",
          },
          body: JSON.stringify({
            model,
            max_tokens: 16,
            messages: [{ role: "user", content: "Reply with exactly the word: pong" }],
          }),
        }, 15000);
        const text = await res.text();
        let parsed = null;
        try { parsed = JSON.parse(text); } catch {}
        out.claude = {
          status: res.ok ? "ok" : "fail",
          httpStatus: res.status,
          message: res.ok
            ? `Reply: ${parsed?.content?.[0]?.text || text.slice(0,200)}`
            : (parsed?.error?.message || text.slice(0, 400)),
          model,
        };
      } catch (e) {
        out.claude = { status: "fail", message: "Network/CORS error reaching api.anthropic.com: " + (e.message || String(e)) };
      }
    }

    setDiag(out);
    setDiagRunning(false);
  };

  const saveKey = () => {
    const k = draftKey.trim();
    if (!k) return;
    setApiKey(k);
    setKeyJustSaved(true);
    setTimeout(() => setKeyJustSaved(false), 2500);
  };

  const downloadTranscript = () => {
    if (!transcript.length) return;
    const payload = {
      generated_at: new Date().toISOString(),
      app: "UAS Response Latency Index — Defense & Conflict-Zone Drone Feed",
      model_used: model,
      feeds_polled: DEFENSE_FEEDS.map(f => ({ name: f.name, url: f.url, category: f.category })),
      classified_items: items,
      agent_calls: transcript,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `agent-transcript-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const counts = useMemo(() => {
    const zones = new Set(items.map(i => i.conflict_zone).filter(Boolean));
    const platforms = new Set(items.map(i => i.drone_class).filter(Boolean));
    return { reports: items.length, zones: zones.size, platforms: platforms.size, sources: DEFENSE_FEEDS.length };
  }, [items]);

  const filtered = useMemo(() => {
    if (!search) return items;
    const q = search.toLowerCase();
    return items.filter(i => JSON.stringify(i).toLowerCase().includes(q));
  }, [items, search]);

  const liveFeed = useMemo(() => [...items].slice(0, 10), [items]);

  const markers = items
    .filter(i => typeof i.lat === "number" && typeof i.lon === "number")
    .map(i => ({
      lat: i.lat,
      lon: i.lon,
      color: i.response_type === "kinetic" ? "#ef4444"
           : i.response_type === "EW/jamming" ? "#eab308"
           : i.response_type === "passive" ? "#3b82f6"
           : "#9ca3af",
      popup: `<b>${(i.id || "").trim()}</b><br/>${safe(i.conflict_zone)}<br/>${safe(i.drone_class)} · ${safe(i.response_type)}${typeof i.fatalities === "number" && i.fatalities > 0 ? `<br/><b style="color:#fde047">${i.fatalities} fatalities</b>` : ""}<br/><a href="${i.link}" target="_blank" style="color:#ef4444">source</a>`,
    }));

  // Fatality-weighted heatmap data: log-scaled with a 0.2 floor so 0-fatality
  // events still register as low-intensity points and high-fatality events glow.
  const heatmapData = useMemo(() => {
    const geo = items.filter(i => typeof i.lat === "number" && typeof i.lon === "number");
    if (geo.length === 0) return [];
    const maxFatal = Math.max(1, ...geo.map(i => Number(i.fatalities) || 0));
    return geo.map(i => {
      const f = Number(i.fatalities) || 0;
      // log-scale + floor: small events show, big events dominate.
      const intensity = Math.min(1, 0.2 + 0.8 * (Math.log(f + 1) / Math.log(maxFatal + 1)));
      return [i.lat, i.lon, intensity];
    });
  }, [items]);

  const totalFatalities = useMemo(
    () => items.reduce((sum, i) => sum + (Number(i.fatalities) || 0), 0),
    [items]
  );

  // Top-10 zones by indexed fatalities, for the lollipop chart
  const topFatalZones = useMemo(() => {
    const tally = new Map();
    items.forEach(i => {
      const f = Number(i.fatalities) || 0;
      if (f <= 0) return;
      const zone = i.conflict_zone || i.country || "Unknown";
      tally.set(zone, (tally.get(zone) || 0) + f);
    });
    return Array.from(tally.entries())
      .map(([zone, fatalities]) => ({ zone, fatalities }))
      .sort((a, b) => b.fatalities - a.fatalities)
      .slice(0, 10);
  }, [items]);

  const runSweep = async () => {
    // === Backend mode: just fetch the pre-classified payload, no key needed ===
    if (backendUrl) {
      setError(null);
      setStatus("fetching");
      try {
        const res = await fetchWithTimeout(`${backendUrl}/api/items`, {}, 15000);
        if (!res.ok) throw new Error(`Backend HTTP ${res.status}`);
        const payload = await res.json();
        const classified = Array.isArray(payload.classified) ? payload.classified : [];
        setItems(classified);
        setSources(payload.sources || null);
        setLastSweep(payload.generated_at ? new Date(payload.generated_at) : new Date());
        setTranscript([
          { type: "backend_fetch", timestamp: new Date().toISOString(), backend: backendUrl, generated_at: payload.generated_at, items: classified.length },
          ...(payload.log || []).map(l => ({ type: "backend_log", ...l })),
        ]);
        setStatus("ready");

        // Push qualifying items into the global incident state
        const newIncidents = classified
          .filter(c => typeof c.lat === "number" && typeof c.lon === "number" && typeof c.reported_latency_seconds === "number")
          .map(c => {
            const total = c.reported_latency_seconds;
            return {
              id: c.id,
              date: (c.pubDate || "").slice(0, 10) || new Date().toISOString().slice(0, 10),
              domain: "defense",
              location: c.conflict_zone || c.country || "Unknown",
              lat: c.lat,
              lon: c.lon,
              incident_type: c.drone_class || "unknown",
              detection_latency_s: Math.max(1, Math.round(total * 0.2)),
              decision_latency_s:  Math.max(1, Math.round(total * 0.4)),
              execution_latency_s: Math.max(1, Math.round(total * 0.4)),
              total_latency_s: total,
              within_window: total <= 15 ? "yes" : "no",
              outcome: c.response_type === "kinetic" ? "threat_neutralized"
                     : c.response_type === "EW/jamming" ? "threat_neutralized"
                     : c.response_type === "passive" ? "no_harm"
                     : "unknown",
              triad_lens: c.triad_lens || "accelerationist",
              detection_description: c.summary || c.title,
              response_description: `Live extraction from ${c.source} (via backend agent).`,
              source: c.link || c.source,
            };
          });
        appendIncidents(newIncidents);
      } catch (e) {
        setStatus("error");
        setError(`Backend fetch failed: ${e.message || e}. Either the backend is down, or the URL is wrong, or the agent has not run a sweep yet (cron hasn't fired and /api/run was never called).`);
      }
      return;
    }

    // === Browser-direct mode: needs a key ===
    let effectiveKey = apiKey;
    if (!effectiveKey && draftKey.trim()) {
      effectiveKey = draftKey.trim();
      setApiKey(effectiveKey);
    }
    if (!effectiveKey) {
      setError("Paste your Anthropic API key into the yellow box above, then click Save key (or just paste and click Run — we'll auto-save). OR set a Backend URL in the Configure panel at the top so visitors don't need a key.");
      setStatus("error");
      return;
    }
    setError(null);
    setFeedErrors([]);
    setStatus("fetching");
    setProgress({ done: 0, total: DEFENSE_FEEDS.length });

    const fetched = [];
    const fErrs = [];
    await Promise.all(DEFENSE_FEEDS.map(async (feed) => {
      try {
        const { items: got } = await fetchFeed(feed, 5);
        fetched.push(...got);
      } catch (e) {
        fErrs.push(`${feed.name}: ${e.message || e}`);
      } finally {
        setProgress(p => ({ ...p, done: p.done + 1 }));
      }
    }));
    setFeedErrors(fErrs);

    if (fetched.length === 0) {
      setStatus("error");
      setError("No feeds returned items. The rss2json proxy may be rate-limited; try again in a minute.");
      return;
    }

    setStatus("classifying");

    // Reset transcript for this sweep so it represents one run
    const sweepTranscript = [];
    sweepTranscript.push({
      timestamp: new Date().toISOString(),
      type: "sweep_started",
      model,
      feeds_attempted: DEFENSE_FEEDS.length,
      feeds_with_errors: fErrs.length,
      raw_items_fetched: fetched.length,
    });

    // Chunk to avoid huge prompts
    const chunks = [];
    const CHUNK = 18;
    for (let i = 0; i < fetched.length; i += CHUNK) chunks.push(fetched.slice(i, i + CHUNK));

    const classified = [];
    let counter = 0;
    for (const chunk of chunks) {
      try {
        const results = await classifyWithClaude(effectiveKey, model, chunk, (entry) => sweepTranscript.push({ type: "claude_call", ...entry }));
        results.forEach((r) => {
          if (r == null || typeof r !== "object") return;
          if (!r.is_drone_related) return;
          const item = chunk[Number(r.index)];
          if (!item) return;
          counter += 1;
          classified.push({
            ...item,
            ...r,
            id: `DEF-${counter.toString().padStart(3, "0")}`,
            extracted_at: new Date().toISOString(),
          });
        });
      } catch (e) {
        setError("Claude classification failed: " + (e.message || String(e)));
      }
    }

    sweepTranscript.push({
      timestamp: new Date().toISOString(),
      type: "sweep_completed",
      drone_related_items_classified: classified.length,
    });
    setTranscript(sweepTranscript);

    setItems(classified);
    setSources({ rss: classified.length, acled: 0, gdelt: 0 });
    setLastSweep(new Date());
    setStatus("ready");

    // Push qualifying items into the global incident state
    const newIncidents = classified
      .filter(c => typeof c.lat === "number" && typeof c.lon === "number" && typeof c.reported_latency_seconds === "number")
      .map(c => {
        const total = c.reported_latency_seconds;
        return {
          id: c.id,
          date: (c.pubDate || "").slice(0, 10) || new Date().toISOString().slice(0, 10),
          domain: "defense",
          location: c.conflict_zone || c.country || "Unknown",
          lat: c.lat,
          lon: c.lon,
          incident_type: c.drone_class || "unknown",
          detection_latency_s: Math.max(1, Math.round(total * 0.2)),
          decision_latency_s:  Math.max(1, Math.round(total * 0.4)),
          execution_latency_s: Math.max(1, Math.round(total * 0.4)),
          total_latency_s: total,
          within_window: total <= 15 ? "yes" : "no",
          outcome: c.response_type === "kinetic"     ? "threat_neutralized"
                 : c.response_type === "EW/jamming"  ? "threat_neutralized"
                 : c.response_type === "passive"     ? "no_harm"
                 : "unknown",
          triad_lens: c.triad_lens || "accelerationist",
          detection_description: c.summary || c.title,
          response_description: `Live extraction from ${c.source}.`,
          source: c.link || c.source,
        };
      });
    appendIncidents(newIncidents);
  };

  return (
    <section>
      <SectionTitle sub={backendUrl
        ? "Reads pre-classified items from your Cloudflare Worker, which polls 9 RSS feeds on a cron schedule and runs Claude classification server-side. No API key needed in the browser."
        : "A live agent fetches real RSS items from defense, OSINT, wire, and trade press feeds, then classifies them with Claude. Items with parsed coordinates and an explicit response time are appended to the global Incident Log below."}>
        🛰️ Defense & Conflict-Zone Drone Feed {backendUrl ? "(Backend)" : "(Live)"}
        {backendUrl
          ? <span className="ml-2 text-[10px] uppercase tracking-wider text-green-400 bg-green-950/40 border border-green-700 rounded px-2 py-0.5 align-middle">backend · no key needed</span>
          : <span className="ml-2 text-[10px] uppercase tracking-wider text-yellow-400 bg-yellow-950/40 border border-yellow-700 rounded px-2 py-0.5 align-middle">live · uses your API key</span>}
      </SectionTitle>

      {backendUrl ? (
        <Card className="p-4 mb-3 border-green-700 bg-green-950/20">
          <div className="text-sm text-green-200">
            📡 Backend mode — reading pre-classified items from <a href={backendUrl} target="_blank" rel="noreferrer" className="underline hover:text-green-100">{backendUrl.replace(/^https?:\/\//, "")}</a>. No API key needed; visitors see the latest cron-published sweep.
          </div>
        </Card>
      ) : (
      <Card className={`p-4 mb-3 ${apiKey ? "border-green-700 bg-green-950/20" : "border-yellow-700 bg-yellow-950/30"}`}>
        {apiKey ? (
          <div className="flex items-center justify-between">
            <div className="text-sm text-green-200">
              ✓ API key set ({apiKey.slice(0, 8)}…{apiKey.slice(-4)}) — agent ready to run
              {keyJustSaved ? <span className="ml-2 text-green-400 text-xs">just saved</span> : null}
            </div>
            <button onClick={() => { setApiKey(""); setDraftKey(""); }}
              className="text-xs text-gray-400 hover:text-red-300 border border-[#333] rounded px-2 py-1">Clear key</button>
          </div>
        ) : (

/* Latency Compression Timeline component                             */
/* ------------------------------------------------------------------ */
function LatencyCompressionTimeline({ incidents }) {
  const scatterData = useMemo(() => {
    const defense = [];
    const civilian = [];
    (incidents || []).forEach(i => {
      if (typeof i.total_latency_s !== "number") return;
      const d = i.date ? new Date(i.date) : null;
      if (!d || Number.isNaN(d.getTime())) return;
      const point = {
        x: d.getTime(),
        y: Math.max(1, i.total_latency_s),
        id: i.id,
        location: safe(i.location),
        domain: i.domain,
        within_window: i.within_window,
        date: d.toISOString().slice(0, 10),
      };
      if (i.domain === "defense") defense.push(point);
      else if (i.domain === "civilian") civilian.push(point);
    });
    return { defense, civilian };
  }, [incidents]);

  const quarterData = useMemo(() => {
    const bandOf = (s) => (s <= 60 ? "seconds" : s <= 600 ? "minutes" : "delayed");
    const quarterOf = (d) => `${d.getFullYear()} Q${Math.floor(d.getMonth() / 3) + 1}`;
    const map = {};
    (incidents || []).forEach(i => {
      if (typeof i.total_latency_s !== "number") return;
      const d = i.date ? new Date(i.date) : null;
      if (!d || Number.isNaN(d.getTime())) return;
      const q = quarterOf(d);
      if (!map[q]) map[q] = { quarter: q, seconds: 0, minutes: 0, delayed: 0, _sort: new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3, 1).getTime() };
      map[q][bandOf(i.total_latency_s)] += 1;
    });
    return Object.values(map).sort((a, b) => a._sort - b._sort);
  }, [incidents]);

  const total = scatterData.defense.length + scatterData.civilian.length;

  const tooltipFormatter = ({ active, payload }) => {
    if (!active || !payload || !payload.length) return null;
    const p = payload[0].payload;
    return (
      <div className="bg-[#0a0a0a] border border-[#333] rounded p-2 text-xs text-gray-200">
        <div className="font-bold text-white">{p.id}</div>
        <div>{p.date} · {p.domain}</div>
        <div>{p.location}</div>
        <div className="mono">total {p.y}s — {p.within_window === "yes" ? <span className="text-green-400">within window</span> : <span className="text-red-400">outside window</span>}</div>
      </div>
    );
  };

  return (
    <section>
      <SectionTitle sub='As timelines compress from minutes to seconds across both civilian and defense domains, effectiveness shifts from perception to coordination — making response latency the critical metric for evaluating AI systems in practice. Each dot is one incident; the red line is the 15-second engagement window.'>
        📉 Latency Compression Timeline — Engagement Window Over Time
      </SectionTitle>

      {total === 0 ? (
        <Card className="p-6 text-center text-gray-500">No incidents with latency data yet. Run a sweep or wait for the agent to populate.</Card>
      ) : (
        <div className="space-y-4">
          <Card className="p-4">
            <div className="text-sm text-white mb-1">Per-incident latency vs. date</div>
            <div className="text-xs text-gray-400 mb-4">log scale, n={total}</div>
            <div style={{ width: "100%", height: 420 }}>
              <ResponsiveContainer>
                <ScatterChart margin={{ top: 10, right: 30, left: 80, bottom: 60 }}>
                  <CartesianGrid stroke="#222" strokeDasharray="3 3" />
                  <XAxis
                    type="number"
                    dataKey="x"
                    name="Date"
                    domain={['dataMin', 'dataMax']}
                    tickFormatter={(t) => new Date(t).toISOString().slice(0, 10)}
                    stroke="#888"
                    tick={{ fill: "#ccc", fontSize: 11 }}
                    label={{ value: "Incident date", position: "insideBottom", offset: -20, fill: "#888" }}
                  />
                  <YAxis
                    type="number"
                    dataKey="y"
                    name="Latency"
                    scale="log"
                    domain={[1, 2000]}
                    allowDataOverflow
                    stroke="#888"
                    tick={{ fill: "#ccc", fontSize: 11 }}
                    tickFormatter={(v) => `${v}s`}
                    label={{ value: "Latency (s, log)", angle: -90, position: "insideLeft", fill: "#888", offset: -10, style: { textAnchor: "middle" } }}
                  />
                  <ZAxis range={[60, 60]} />
                  <Tooltip content={tooltipFormatter} cursor={{ stroke: "#444", strokeDasharray: "3 3" }} />
                  <Legend wrapperStyle={{ color: "#ccc", paddingTop: 20 }} verticalAlign="bottom" />
                  <ReferenceLine y={15} stroke="#ef4444" strokeWidth={2}
                    label={{ value: "15s engagement window — Sightline / counter-UAS doctrine", position: "insideBottomRight", fill: "#ef4444", fontSize: 11 }} />
                  <ReferenceLine y={300} stroke="#888" strokeDasharray="4 4"
                    label={{ value: "5-minute coordination ceiling", position: "insideTopRight", fill: "#888", fontSize: 11 }} />
                  <Scatter name="Defense" data={scatterData.defense} fill="#3b82f6" />
                  <Scatter name="Civilian" data={scatterData.civilian} fill="#f97316" />
                </ScatterChart>
              </ResponsiveContainer>
            </div>
            <div className="text-[11px] text-gray-500 mt-2">
              Defense incidents cluster near the engagement window; civilian incidents sit firmly above the 5-minute coordination ceiling — exactly the divergence the paper argues for.
            </div>
          </Card>

          <Card className="p-4">
            <div className="text-sm text-white mb-2">Latency-band composition by quarter</div>
            <div style={{ width: "100%", height: 240 }}>
              <ResponsiveContainer>
                <BarChart data={quarterData} margin={{ top: 10, right: 30, left: 0, bottom: 10 }}>
                  <CartesianGrid stroke="#222" strokeDasharray="3 3" />
                  <XAxis dataKey="quarter" stroke="#888" tick={{ fill: "#ccc", fontSize: 11 }} />
                  <YAxis stroke="#888" tick={{ fill: "#ccc", fontSize: 11 }} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: "#0a0a0a", border: "1px solid #333", color: "#fff" }} />
                  <Legend wrapperStyle={{ color: "#ccc" }} />
                  <Bar dataKey="seconds" stackId="a" fill="#22c55e" name="seconds (≤60)" />
                  <Bar dataKey="minutes" stackId="a" fill="#eab308" name="minutes (61–600)" />
                  <Bar dataKey="delayed" stackId="a" fill="#ef4444" name="delayed (>600)" />
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div className="text-[11px] text-gray-500 mt-2">
              When the green band grows quarter over quarter, coordination is winning; when red dominates, perception still beats execution.
            </div>
          </Card>
        </div>
      )}
    </section>
  );
}

function UASLatencyTab({ apiKey, setApiKey, model, backendUrl }) {
  const [programs, setPrograms] = useState(buildSeedWithTimestamps());
  const [incidents, setIncidents] = useState(SEED_INCIDENTS);
  const [lastSweep, setLastSweep] = useState(new Date());
  const [progSearch, setProgSearch] = useState("");
  const [incSearch, setIncSearch] = useState("");
  const [domainFilter, setDomainFilter] = useState("all");
  const [bandFilter, setBandFilter] = useState("all");
  const [outcomeFilter, setOutcomeFilter] = useState("all");
  const [logDomain, setLogDomain] = useState("all");
  const [logTriad, setLogTriad] = useState("all");
  const [expandedRow, setExpandedRow] = useState(null);

  const appendIncidents = (newOnes) => {
    if (!newOnes || !newOnes.length) return;
    setIncidents(prev => {
      const seen = new Set(prev.map(p => p.id));
      const fresh = newOnes.filter(n => !seen.has(n.id));
      return [...prev, ...fresh];
    });
  };

  /* Sweep button: in backend mode, fetch real live records and merge.
     Otherwise just refresh the seed timestamps (illustrative). */
  const [usSweepStatus, setUsSweepStatus] = useState("idle"); // idle | fetching | error
  const [usSweepError, setUsSweepError] = useState(null);

  const reRunSweep = async () => {
    setUsSweepError(null);
    if (backendUrl) {
      setUsSweepStatus("fetching");
      try {
        const res = await fetchWithTimeout(`${backendUrl}/api/us-programs`, {}, 15000);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        const live = Array.isArray(payload.programs) ? payload.programs : [];
        // Merge: keep all seed records, add live records that aren't already in (by city|state|agency).
        setPrograms(prev => {
          const seen = new Set(prev.map(p => `${(p.city || "").toLowerCase()}|${(p.state || "").toUpperCase()}|${(p.agency || "Other").toLowerCase()}`));
          const additions = live.filter(p => {
            const key = `${(p.city || "").toLowerCase()}|${(p.state || "").toUpperCase()}|${(p.agency || "Other").toLowerCase()}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          }).map(p => ({ ...p, live: true }));
          return [...prev, ...additions];
        });
        setUsSweepStatus("idle");
      } catch (e) {
        setUsSweepStatus("error");
        setUsSweepError(`Backend fetch failed: ${e.message || e}`);
      }
    } else {
      // Browser mode: just perturb timestamps so the feed feels live (illustrative only)
      setPrograms(prev => prev.map((p, i) => ({
        ...p,
        extracted_at: new Date(Date.now() - i * 33 * 60 * 1000).toISOString(),
      })));
    }
    setLastSweep(new Date());
  };

  /* Section 1 metrics */
  const programsIndexed = programs.length;
  const citiesMonitored = new Set(programs.map(p => p.city)).size;
  const statesCovered = new Set(programs.map(p => p.state)).size;
  const SOURCES = ["Google News", "sUAS News", "DroneLife", "Unmanned Airspace"];
  const sourcesTracked = SOURCES.length;

  /* Live extraction feed (most recent 10) */
  const liveFeed = useMemo(() => {
    return [...programs]
      .sort((a, b) => new Date(b.extracted_at) - new Date(a.extracted_at))
      .slice(0, 10);
  }, [programs]);

  /* Drone program markers */
  const programMarkers = programs.map(p => ({
    lat: p.lat,
    lon: p.lon,
    color: p.program_type === "DFR" ? "#3b82f6" : "#a855f7",
    popup: `<b>${p.city}, ${p.state}</b><br/>${p.agency}<br/>${p.program_type}<br/>Source: ${p.source_name}`,
  }));

  /* Section 2 latency snapshot */
  const totalIncidents = incidents.length;
  const avgLatency = totalIncidents ? incidents.reduce((a, b) => a + b.total_latency_s, 0) / totalIncidents : 0;
  const civCount = incidents.filter(i => i.domain === "civilian").length;
  const defCount = incidents.filter(i => i.domain === "defense").length;
  const withinCount = incidents.filter(i => i.within_window === "yes").length;
  const outsideCount = totalIncidents - withinCount;
  const defWithinPct = defCount ? (incidents.filter(i => i.domain === "defense"  && i.within_window === "yes").length / defCount) * 100 : 0;
  const civWithinPct = civCount ? (incidents.filter(i => i.domain === "civilian" && i.within_window === "yes").length / civCount) * 100 : 0;

  /* Section 3 incident map filtering */
  const bandOf = (s) => (s <= 60 ? "seconds" : s <= 600 ? "minutes" : "delayed");
  const filteredIncidents = incidents.filter(i => {
    if (domainFilter !== "all" && i.domain !== domainFilter) return false;
    if (bandFilter   !== "all" && bandOf(i.total_latency_s) !== bandFilter) return false;
    if (outcomeFilter !== "all" && i.outcome !== outcomeFilter) return false;
    return true;
  });
  const incidentMarkers = filteredIncidents.map(i => ({
    lat: i.lat,
    lon: i.lon,
    color: i.domain === "defense" ? "#3b82f6" : "#f97316",
    popup: `<b>${i.id}</b><br/>${i.location}<br/>${i.domain} · ${i.incident_type}<br/>${i.total_latency_s}s · ${i.outcome}`,
  }));

  /* Section 4 agentic estimate */
  const agenticRows = incidents.map(i => {
    const est = i.total_latency_s * 0.37;
    return {
      ...i,
      agentic_estimate: est,
      seconds_saved: i.total_latency_s - est,
      meets_window: est <= 15 ? "yes" : "no",
    };
  });
  const additionalWithin = agenticRows.filter(r => r.meets_window === "yes" && r.within_window !== "yes").length;

  /* Section 5 incident log */
  const logFiltered = incidents.filter(i => {
    if (logDomain !== "all" && i.domain !== logDomain) return false;
    if (logTriad  !== "all" && i.triad_lens !== logTriad) return false;
    if (incSearch) {
      const q = incSearch.toLowerCase();
      const blob = JSON.stringify(i).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  const downloadIncidentsCSV = () => {
    const cols = ["id","date","domain","location","lat","lon","incident_type",
      "detection_latency_s","decision_latency_s","execution_latency_s","total_latency_s",
      "within_window","outcome","triad_lens","detection_description","response_description","source"];
    const csv = [
      cols.join(","),
      ...incidents.map(i => cols.map(c => {
        const v = i[c] == null ? "Unknown" : i[c];
        const s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? `"${s}"` : s;
      }).join(","))
    ].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "uas_incidents.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  /* Section 6 triad analysis */
  const triadStats = (lens) => {
    const subset = incidents.filter(i => i.triad_lens === lens);
    if (!subset.length) return { count: 0, avg: 0, outcomes: {}, positive: 0 };
    const avg = subset.reduce((a, b) => a + b.total_latency_s, 0) / subset.length;
    const outcomes = subset.reduce((acc, i) => { acc[i.outcome] = (acc[i.outcome] || 0) + 1; return acc; }, {});
    const positive = subset.filter(i => i.outcome === "threat_neutralized" || i.outcome === "no_harm").length;
    const escapedOrUnknown = subset.filter(i => i.outcome === "threat_escaped" || i.outcome === "unknown").length;
    return { count: subset.length, avg, outcomes, positive, escapedOrUnknown };
  };
  const accel = triadStats("accelerationist");
  const safety = triadStats("safetyist");
  const skep = triadStats("skeptic");

  /* Render */
  return (
    <div className="space-y-10">
      {/* ----- Section 1: Agentic Open-Source Scanner ----- */}
      <section>
        <SectionTitle sub="A live agent scans public RSS feeds (Google News, sUAS News, DroneLife, Unmanned Airspace) for U.S. cities operating municipal drone programs. Click Re-run Sweep to fetch the latest reporting.">
          🔍 Agentic Open-Source Scanner — U.S. Drone Programs
        </SectionTitle>

        <div className="grid grid-cols-1 md:grid-cols-5 gap-3 items-stretch">
          <Metric label="Programs Indexed"     value={programsIndexed} />
          <Metric label="Cities Monitored"     value={citiesMonitored} />
          <Metric label="States Covered"       value={statesCovered} />
          <Metric label="Open Sources Tracked" value={sourcesTracked} />
          <Card className="p-4 flex items-center justify-center">
            <Btn onClick={reRunSweep} variant="primary" className="w-full flex items-center justify-center gap-2">
              <span style={{ display: "inline-block" }}>↻</span> {usSweepStatus === "fetching" ? "Fetching…" : (backendUrl ? "Re-run Sweep (live)" : "Re-run Sweep")}
            </Btn>
          </Card>
        </div>

        <div className="mt-3 flex items-center gap-2 text-sm text-gray-300 flex-wrap">
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: "#22c55e", boxShadow: "0 0 8px #22c55e", display: "inline-block" }} />
          <span>
            Agent status: {backendUrl ? "live (backend)" : "seed only"} · Last sweep at {formatTimestamp(lastSweep)} · {sourcesTracked} sources monitored · {programsIndexed} records in index
            {programs.filter(p => p.live).length > 0 ? <span className="text-green-400 ml-1">· {programs.filter(p => p.live).length} live</span> : null}
          </span>
        </div>
        {usSweepError ? <div className="mt-1 text-xs text-red-400">{usSweepError}</div> : null}

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
          <Card className="p-3">
            <div className="text-sm font-medium text-white mb-2">Live Extraction Feed</div>
            <div className="space-y-1 text-xs mono max-h-[420px] overflow-y-auto">
              {liveFeed.map((p, i) => (
                <div key={i} className="border-b border-[#222] py-1 text-gray-300">
                  {p.live ? <span className="text-[10px] uppercase tracking-wider text-green-400 border border-green-700 bg-green-950/40 rounded px-1 mr-1">live</span> : null}
                  <span className="text-gray-500">{formatTimestamp(p.extracted_at)}</span>
                  {" · "}
                  <span className="text-white">{safe(p.city)}, {safe(p.state)}</span>
                  {" · "}
                  <span className="text-gray-400">{safe(p.agency)}</span>
                  {" · "}
                  <span className={p.program_type === "DFR" ? "text-blue-400" : "text-purple-400"}>{safe(p.program_type)}</span>
                  {" · "}
                  {p.source_url ? (
                    <a href={p.source_url} target="_blank" rel="noreferrer" className="text-red-400 hover:text-red-300 underline">{safe(p.source_name)}</a>
                  ) : (
                    <a href={programSourceUrl(p)} target="_blank" rel="noreferrer" className="text-red-400 hover:text-red-300 underline">{safe(p.source_name)}</a>
                  )}
                </div>
              ))}
            </div>
          </Card>
          <Card className="p-3">
            <div className="text-sm font-medium text-white mb-2">U.S. Drone Program Map</div>
            <LeafletMap id="program-map" center={[39.5, -98.35]} zoom={4} markers={programMarkers} height={400}
              legend={[
                { color: "#3b82f6", label: "DFR" },
                { color: "#a855f7", label: "Municipal UAS" },
              ]} />
          </Card>
        </div>

        <div className="mt-4">
          <SearchableTable
            rows={programs}
            search={progSearch}
            setSearch={setProgSearch}
            placeholder="Search programs by city, state, agency, type, source…"
            columns={[
              { key: "city",            label: "City",  render: r => <span>{r.live ? <span className="text-[10px] uppercase tracking-wider text-green-400 border border-green-700 bg-green-950/40 rounded px-1 mr-1">live</span> : null}{safe(r.city)}</span> },
              { key: "state",           label: "State" },
              { key: "agency",          label: "Agency" },
              { key: "program_type",    label: "Program Type" },
              { key: "avg_response_min",label: "Avg Response (min)", render: r => r.avg_response_min == null ? "Unknown" : Number(r.avg_response_min).toFixed(2) },
              { key: "source_name",     label: "Source", render: r => <a href={r.source_url || programSourceUrl(r)} target="_blank" rel="noreferrer" className="text-red-400 hover:text-red-300 underline">{safe(r.source_name)}</a> },
              { key: "extracted_at",    label: "Extracted At", render: r => formatTimestamp(r.extracted_at) },
            ]}
          />
        </div>
      </section>

      {/* ----- Section 1.5: Live Defense / Conflict-Zone Drone Feed ----- */}
      <DefenseFeedScanner apiKey={apiKey} setApiKey={setApiKey} model={model} backendUrl={backendUrl} appendIncidents={appendIncidents} />

      {/* ----- Section 2: Latency Snapshot ----- */}
      <section>
        <SectionTitle>Latency Snapshot</SectionTitle>
        <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
          <Metric label="Total Incidents" value={totalIncidents} />
          <Metric label="Avg Latency (s)" value={num(avgLatency, 1)} />
          <Metric label="Civilian"        value={civCount} />
          <Metric label="Defense"         value={defCount} />
          <Metric label="Within Window"   value={withinCount} />
          <Metric label="Outside Window"  value={outsideCount} />
        </div>
        <div className="mt-3">
          <InfoBox tone="blue">
            {pct(defWithinPct)} of defense incidents fell within the 15-second engagement window vs {pct(civWithinPct)} of civilian incidents.
          </InfoBox>
        </div>
      </section>

      {/* ----- Section 3: Incident Map ----- */}
      <section>
        <SectionTitle>Incident Map</SectionTitle>
        <div className="flex flex-wrap gap-2 mb-3">
          <Select value={domainFilter} onChange={e => setDomainFilter(e.target.value)}>
            <option value="all">Domain: all</option>
            <option value="civilian">civilian</option>
            <option value="defense">defense</option>
          </Select>
          <Select value={bandFilter} onChange={e => setBandFilter(e.target.value)}>
            <option value="all">Latency Band: all</option>
            <option value="seconds">seconds (≤60)</option>
            <option value="minutes">minutes (61–600)</option>
            <option value="delayed">delayed (&gt;600)</option>
          </Select>
          <Select value={outcomeFilter} onChange={e => setOutcomeFilter(e.target.value)}>
            <option value="all">Outcome: all</option>
            <option value="threat_neutralized">threat_neutralized</option>
            <option value="threat_escaped">threat_escaped</option>
            <option value="no_harm">no_harm</option>
          </Select>
        </div>
        <LeafletMap id="incident-map" center={[20, 0]} zoom={2} markers={incidentMarkers} height={420}
          legend={[
            { color: "#3b82f6", label: "Defense" },
            { color: "#f97316", label: "Civilian" },
          ]}
        />
      </section>

      {/* ----- Section 4: What Would an Agentic System Have Changed? ----- */}
      <section>
        <SectionTitle>What Would an Agentic System Have Changed?</SectionTitle>
        <div className="overflow-x-auto border border-[#333] rounded">
          <table className="w-full text-sm">
            <thead className="bg-[#1a1a1a]">
              <tr>
                {["Incident ID","Location","Domain","Current Latency (s)","Agentic Estimate (s)","Seconds Saved","Meets Window"].map(h => (
                  <th key={h} className="text-left px-3 py-2 font-medium text-gray-300 border-b border-[#333]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {agenticRows.map(r => (
                <tr key={r.id} className="bg-[#111] border-b border-[#222] hover:bg-[#181818]">
                  <td className="px-3 py-2 mono text-white">{r.id}</td>
                  <td className="px-3 py-2 mono">{safe(r.location)}</td>
                  <td className="px-3 py-2 mono">{safe(r.domain)}</td>
                  <td className="px-3 py-2 mono">{num(r.total_latency_s, 1)}</td>
                  <td className="px-3 py-2 mono">{num(r.agentic_estimate, 1)}</td>
                  <td className="px-3 py-2 mono">{num(r.seconds_saved, 1)}</td>
                  <td className={`px-3 py-2 mono ${r.meets_window === "yes" ? "text-green-400" : "text-red-400"}`}>{r.meets_window}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="mt-3">
          <InfoBox tone="green">
            Under an agentic coordination layer, {additionalWithin} additional incidents would have fallen within the 15-second engagement window.
          </InfoBox>
        </div>
      </section>

      {/* ----- Section 4.5: Latency Compression Timeline ----- */}
      <LatencyCompressionTimeline incidents={incidents} />

      {/* ----- Section 5: Incident Log ----- */}
      <section>
        <SectionTitle>Incident Log</SectionTitle>
        <div className="flex flex-wrap gap-2 mb-3">
          <Select value={logDomain} onChange={e => setLogDomain(e.target.value)}>
            <option value="all">Domain: all</option>
            <option value="civilian">civilian</option>
            <option value="defense">defense</option>
          </Select>
          <Select value={logTriad} onChange={e => setLogTriad(e.target.value)}>
            <option value="all">Triad lens: all</option>
            <option value="accelerationist">accelerationist</option>
            <option value="safetyist">safetyist</option>
            <option value="skeptic">skeptic</option>
          </Select>
          <Input value={incSearch} onChange={e => setIncSearch(e.target.value)} placeholder="Search incidents…" className="max-w-md" />
          <Btn onClick={downloadIncidentsCSV} variant="secondary">⬇ Download all incidents (CSV)</Btn>
        </div>
        <div className="overflow-x-auto border border-[#333] rounded">
          <table className="w-full text-sm">
            <thead className="bg-[#1a1a1a]">
              <tr>
                {["", "ID","Date","Domain","Location","Type","Det (s)","Dec (s)","Exec (s)","Total (s)","Within","Outcome","Triad"].map(h => (
                  <th key={h} className="text-left px-3 py-2 font-medium text-gray-300 border-b border-[#333]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {logFiltered.length === 0 ? (
                <tr><td colSpan={13} className="px-3 py-6 text-center text-gray-500">No matching incidents.</td></tr>
              ) : logFiltered.map(i => (
                <React.Fragment key={i.id}>
                  <tr className="bg-[#111] border-b border-[#222] hover:bg-[#181818]">
                    <td className="px-3 py-2">
                      <button onClick={() => setExpandedRow(expandedRow === i.id ? null : i.id)} className="text-gray-400 hover:text-white">
                        {expandedRow === i.id ? "▼" : "▶"}
                      </button>
                    </td>
                    <td className="px-3 py-2 mono text-white">{i.id}</td>
                    <td className="px-3 py-2 mono">{safe(i.date)}</td>
                    <td className="px-3 py-2 mono">{safe(i.domain)}</td>
                    <td className="px-3 py-2 mono">{safe(i.location)}</td>
                    <td className="px-3 py-2 mono">{safe(i.incident_type)}</td>
                    <td className="px-3 py-2 mono">{i.detection_latency_s}</td>
                    <td className="px-3 py-2 mono">{i.decision_latency_s}</td>
                    <td className="px-3 py-2 mono">{i.execution_latency_s}</td>
                    <td className="px-3 py-2 mono">{i.total_latency_s}</td>
                    <td className={`px-3 py-2 mono ${i.within_window === "yes" ? "text-green-400" : "text-red-400"}`}>{i.within_window}</td>
                    <td className="px-3 py-2 mono">{safe(i.outcome)}</td>
                    <td className="px-3 py-2 mono">{safe(i.triad_lens)}</td>
                  </tr>
                  {expandedRow === i.id ? (
                    <tr className="bg-[#0d0d0d] border-b border-[#222]">
                      <td colSpan={13} className="px-6 py-4 text-sm text-gray-300 space-y-2">
                        <div><span className="text-gray-500 uppercase text-xs tracking-wider">Detection</span><br/>{safe(i.detection_description)}</div>
                        <div><span className="text-gray-500 uppercase text-xs tracking-wider">Response</span><br/>{safe(i.response_description)}</div>
                        <div><span className="text-gray-500 uppercase text-xs tracking-wider">Source</span><br/>{safe(i.source)}</div>
                      </td>
                    </tr>
                  ) : null}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {/* ----- Section 6: AI Triad Claim Testing ----- */}
      <section>
        <SectionTitle>AI Triad Claim Testing</SectionTitle>
        <div className="space-y-3">
          {[
            {
              key: "accelerationist",
              label: "Accelerationist",
              stats: accel,
              finding: accel.avg < 30
                ? "Consistent with accelerationist expectations."
                : "Capability improvements did not produce fast response, suggesting coordination gaps remain.",
            },
            {
              key: "safetyist",
              label: "Safetyist",
              stats: safety,
              finding: `Safety-oriented responses achieved ${safety.count ? num((safety.positive/safety.count)*100, 1) : "Unknown"}% positive outcomes but averaged ${safety.count ? num(safety.avg, 1) : "Unknown"} seconds.`,
            },
            {
              key: "skeptic",
              label: "Skeptic",
              stats: skep,
              finding: `${skep.count ? num((skep.escapedOrUnknown/skep.count)*100, 1) : "Unknown"}% of skeptic-tagged incidents ended in threat_escaped or unknown outcomes.`,
            },
          ].map(s => (
            <Card key={s.key}>
              <details>
                <summary className="px-4 py-3 flex items-center justify-between text-white">
                  <span className="font-medium">{s.label}</span>
                  <span className="text-xs text-gray-400">avg {num(s.stats.avg, 1)}s · n={s.stats.count}</span>
                </summary>
                <div className="px-4 pb-4 text-sm text-gray-300 space-y-2 border-t border-[#222]">
                  <div className="pt-3">
                    <div className="text-xs uppercase text-gray-500 tracking-wider mb-1">Outcome breakdown</div>
                    <div className="flex flex-wrap gap-2 mono">
                      {Object.entries(s.stats.outcomes).map(([k, v]) => (
                        <span key={k} className="bg-[#111] border border-[#333] rounded px-2 py-1">{k}: {v}</span>
                      ))}
                      {Object.keys(s.stats.outcomes).length === 0 ? <span className="text-gray-500">No data</span> : null}
                    </div>
                  </div>
                  <div className="pt-2">
                    <div className="text-xs uppercase text-gray-500 tracking-wider mb-1">Finding</div>
                    <div>{s.finding}</div>
                  </div>
                </div>
              </details>
            </Card>
          ))}
        </div>
      </section>

      {/* ----- Section 7: AI Triad Reference Table ----- */}
      <section>
        <SectionTitle>AI Triad Reference Table</SectionTitle>
        <div className="overflow-x-auto border border-[#333] rounded">
          <table className="w-full text-sm">
            <thead className="bg-[#1a1a1a]">
              <tr>
                {["Perspective","What They Measure","What They Miss","How Latency Fixes It"].map(h => (
                  <th key={h} className="text-left px-3 py-2 font-medium text-gray-300 border-b border-[#333]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                ["Accelerationist","Capability and accuracy","Coordination speed","Latency tests whether capability translates to action"],
                ["Safetyist","Error rates and compliance","Timing of response","Latency adds temporal accountability"],
                ["Skeptic","Interpretability and trust","Execution speed","Latency measures whether interpretation leads to action"],
              ].map((row, i) => (
                <tr key={i} className="bg-[#111] border-b border-[#222]">
                  {row.map((cell, j) => (
                    <td key={j} className={`px-3 py-2 ${j === 0 ? "text-white font-medium" : "text-gray-300"}`}>{cell}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {/* ----- Section 8: Methodology and Limitations ----- */}
      <section>
        <SectionTitle>Methodology and Limitations</SectionTitle>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <Card className="p-4">
            <div className="text-sm font-medium text-white mb-2">Methodology</div>
            <p className="text-sm text-gray-300 mb-2">
              UAS Response Latency is defined as the wall-clock time between first credible detection of an
              uncrewed aerial system and the conclusion of an authorized response action.
            </p>
            <p className="text-sm text-gray-300 mb-2">
              Each incident is decomposed into three sequential intervals: <span className="text-white">detection</span>
              (sensor or report acquisition), <span className="text-white">decision</span> (assessment and
              authorization), and <span className="text-white">execution</span> (deployment and resolution).
            </p>
            <p className="text-sm text-gray-300">
              The 15-second engagement window is drawn from publicly disclosed counter-UAS doctrine and
              short-range air defense literature, and is used as a benchmark — not a hard threshold — for
              "in-window" response.
            </p>
          </Card>
          <Card className="p-4">
            <div className="text-sm font-medium text-white mb-2">Limitations</div>
            <ul className="text-sm text-gray-300 space-y-2 list-disc pl-5">
              <li>Open-source reporting gaps: many incidents are never publicly disclosed, especially in defense contexts.</li>
              <li>Inconsistent timestamping: source articles often report relative times ("within minutes") rather than precise intervals.</li>
              <li>Triad-lens tagging reflects analyst judgment rather than a formal, reproducible classifier.</li>
              <li>This dataset is illustrative rather than comprehensive; absolute counts should not be cited without further validation.</li>
            </ul>
          </Card>
        </div>
      </section>
    </div>
  );
}

const TEMPLATE_ROWS = [
  { initiative_name: "Cardiac Response Brooklyn",        incident_type: "Emergency Medical",       current_avg_response_minutes: 18.5, geography: "Brooklyn NY",  peak_incidents_per_day: 45, notes: "FDNY 2023 average" },
